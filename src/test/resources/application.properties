# database
quarkus.datasource.username=quarkus_test
quarkus.datasource.password=quarkus_test
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost/quarkus_test
quarkus.liquibase.clean-at-start=true

# storage
app.storage.item-image.path=./src/test/resources/item-image
# Keycloak dev services: quay.io is this property's default, and a cold pull from there through the
# daemon proxy fails, which Quarkus reports as SKIPPED tests rather than an error. Same image, reliable
# registry.
quarkus.keycloak.devservices.image-name=docker.io/keycloak/keycloak:26.5.4
